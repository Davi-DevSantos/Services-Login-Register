[project]
name = "api-login"
version = "0.1.0"
description = "API profissional para autenticação e login"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "PyJWT>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.2.0",
  "cachetools>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
