<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>API Login - Autenticação</title>
</head>
<body>
    <script src="js.js" defer></script>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <div class="container">
        <div class="form-group">
            <div class="login">
                <h2>Login</h2>
                <label for="login-email">Email</label>
                <input class="form-control" type="email" name="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
                <label for="login-password">Senha</label>
                <input class="form-control" type="password" name="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
                <input type="button" value="Entrar" class="btn" id="login-btn">
                <a id="register-link" href="#">Não tem conta? Cadastre-se</a>
                <p id="login-msg" class="msg"></p>
            </div>
            <div class="register">
                <h2>Criar Conta</h2>
                <label for="register-username">Usuário</label>
                <input class="form-control" type="text" name="username" id="register-username" placeholder="seu usuario" autocomplete="username">
                <label for="register-email">Email</label>
                <input class="form-control" type="email" name="email" id="register-email" placeholder="seu@email.com" autocomplete="email">
                <label for="register-password">Senha</label>
                <input class="form-control" type="password" name="password" id="register-password" placeholder="mín. 8 caracteres" autocomplete="new-password">
                <label for="register-confirm-password">Confirmar Senha</label>
                <input class="form-control" type="password" name="confirm_password" id="register-confirm-password" placeholder="repita a senha" autocomplete="new-password">
                <input type="button" value="Cadastrar" class="btn" id="register-btn">
                <a id="login-link" href="#">Já tem conta? Entrar</a>
                <p id="register-msg" class="msg"></p>
            </div>
            <div class="cover-panel">
                <h2>Bem-vindo</h2>
                <p>Faça login ou crie sua conta para continuar.</p>
            </div>
        </div>
    </div>
</body>
</html>
